name: Release Cencurity Core

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
      channel:
        description: Release channel (stable/canary)
        required: false
        default: stable
      artifact_base_url:
        description: Optional public base URL for manifest artifact links
        required: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            output: dist/releases/win32-x64/cencurity-core.exe
            script: npm run build:binary:win32-x64
          - os: ubuntu-latest
            target: linux-x64
            output: dist/releases/linux-x64/cencurity-core
            script: npm run build:binary:linux-x64
          - os: macos-latest
            target: darwin-x64
            output: dist/releases/darwin-x64/cencurity-core
            script: npm run build:binary:darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build standalone core binary
        run: ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Release version is empty"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/releases

      - name: Normalize artifact layout
        shell: bash
        run: |
          mkdir -p dist/releases/win32-x64 dist/releases/linux-x64 dist/releases/darwin-x64
          find dist/releases -maxdepth 2 -type f -print

      - name: Generate manifest
        shell: bash
        run: |
          BASE_URL="$ARTIFACT_BASE_URL"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.version.outputs.value }}"
          fi
          node ./scripts/generate_manifest.js \
            --version "${{ steps.version.outputs.value }}" \
            --channel "$RELEASE_CHANNEL" \
            --base-url "$BASE_URL" \
            --artifacts-dir ./dist/releases \
            --output ./dist/releases/manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Cencurity Core v${{ steps.version.outputs.value }}
          files: |
            dist/releases/win32-x64/*
            dist/releases/linux-x64/*
            dist/releases/darwin-x64/*
            dist/releases/manifest.json
